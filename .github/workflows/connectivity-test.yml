name: connectivity-test

# 手動実行だけ（定期実行はしない）。
# GitHub アプリ／ブラウザの Actions 画面から「Run workflow」で走る。
# 1行で書くのは、貼り付けで字下げが失われても壊れないようにするため。
on: [workflow_dispatch]

jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Python を用意
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: 1. 外部サイトに接続できるか
        continue-on-error: true
        run: |
          echo "--- Yahoo Finance ---"
          curl -sS -m 30 -o /dev/null -w 'yahoo_chart=%{http_code} time=%{time_total}\n' \
            'https://query1.finance.yahoo.com/v8/finance/chart/7203.T?range=5d&interval=1d' || echo "yahoo_chart=FAILED"
          echo "--- JPX ---"
          curl -sS -m 30 -o /dev/null -w 'jpx=%{http_code} time=%{time_total}\n' \
            'https://www.jpx.co.jp/markets/statistics-equities/margin/05.html' || echo "jpx=FAILED"

      - name: 2. ライブラリを入れる
        run: pip install --quiet yfinance pandas pymupdf

      - name: 3. 財務データ（info）が取れるか
        continue-on-error: true
        run: |
          python - <<'PY'
          import warnings, time
          warnings.filterwarnings("ignore")
          import yfinance as yf

          ok = 0
          for code in ("7203.T", "1301.T", "9432.T"):
              t0 = time.time()
              try:
                  info = yf.Ticker(code).info or {}
                  per, pbr, cap = (info.get("trailingPE"), info.get("priceToBook"),
                                   info.get("marketCap"))
                  if per or pbr or cap:
                      ok += 1
                  print(f"{code}: PER={per} PBR={pbr} 時価総額={cap} ({time.time()-t0:.1f}秒)")
              except Exception as e:
                  print(f"{code}: 失敗 {type(e).__name__}: {str(e)[:120]}")
          print(f"=> info 成功 {ok}/3")
          PY

      - name: 4. 株価のまとめ取得（20銘柄を5回くり返す）
        continue-on-error: true
        run: |
          python - <<'PY'
          import warnings, time
          warnings.filterwarnings("ignore")
          import yfinance as yf

          codes = ["7203.T","6758.T","9432.T","8306.T","9984.T","1301.T","4502.T",
                   "6501.T","7267.T","8058.T","4063.T","6902.T","7974.T","9433.T",
                   "8035.T","4661.T","6273.T","6146.T","7741.T","6920.T"]
          for n in range(1, 6):
              t0 = time.time()
              try:
                  d = yf.download(codes, period="5d", interval="1d", group_by="ticker",
                                  auto_adjust=False, progress=False, threads=True)
                  got = sum(1 for c in codes
                            if c in d.columns.get_level_values(0).unique())
                  print(f"{n}回目: 取得 {got}/{len(codes)}銘柄  {time.time()-t0:.1f}秒")
              except Exception as e:
                  print(f"{n}回目: 失敗 {type(e).__name__}: {str(e)[:120]}")
          PY

      - name: 5. JPX の PDF が取れるか
        continue-on-error: true
        run: |
          python - <<'PY'
          import re, urllib.request

          UA = {"User-Agent": "Mozilla/5.0"}
          try:
              req = urllib.request.Request(
                  "https://www.jpx.co.jp/markets/statistics-equities/margin/05.html",
                  headers=UA)
              html = urllib.request.urlopen(req, timeout=60).read().decode("utf-8", "replace")
              pdfs = sorted(re.findall(r'href="([^"]*syumatsu\d{8}00\.pdf)"', html))
              print(f"週末残高PDFのリンク {len(pdfs)}件  最新: {pdfs[-1] if pdfs else '-'}")
              if pdfs:
                  url = "https://www.jpx.co.jp" + pdfs[-1]
                  raw = urllib.request.urlopen(
                      urllib.request.Request(url, headers=UA), timeout=90).read()
                  print(f"ダウンロード {len(raw):,} バイト")
                  import fitz
                  doc = fitz.open(stream=raw, filetype="pdf")
                  print(f"PDF ページ数 {doc.page_count}")
          except Exception as e:
              print(f"失敗 {type(e).__name__}: {str(e)[:160]}")
          PY
